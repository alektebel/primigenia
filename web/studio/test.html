<!doctype html><html lang="en"><meta charset="utf-8"><title>Primigenia studio contracts</title>
<pre id="out">Running document, placement and rejection contracts…</pre>
<iframe title="Studio under test" id="f" src="index.html" style="width:1000px;height:700px"></iframe>
<script src="contracts.js"></script>
<script>
const f=document.getElementById('f');
const timer=setInterval(async()=>{if(!f.contentWindow.CreatureStudio?.ready)return;clearInterval(timer);try{const result=await studioContracts(f.contentWindow.CreatureStudio);document.getElementById('out').textContent='ALL OK\n'+JSON.stringify(result,null,2)}catch(e){document.getElementById('out').textContent='FAIL '+e.stack}},200);
</script></html>

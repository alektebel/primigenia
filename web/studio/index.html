<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Primigenia · Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: escena a pantalla completa; paleta de piezas flotando a la izquierda, ficha a la derecha, modos arriba, ADN abajo */
  --ink:#10202b; --glass:rgba(14,32,44,.82); --paper:#f2f6f4; --muted:#9db3bb; --line:rgba(190,225,235,.18);
  --amber:#ffc04a; --moss:#9fd45c; --sky:#6fd3ff; --danger:#ff7a5c;
  --display:'Baloo 2','Trebuchet MS',system-ui,sans-serif; --body:'Figtree',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{position:relative;background:var(--ink);color:var(--paper);font-family:var(--body);font-size:14px;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--paper);outline-offset:2px}
#stage{position:absolute;inset:0}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.card{position:absolute;z-index:3;background:var(--glass);border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
#left{top:14px;left:14px;width:232px;max-height:calc(100% - 104px);display:flex;flex-direction:column;padding:12px}
#right{top:14px;right:14px;width:268px;max-height:calc(100% - 28px);overflow:auto;padding:14px}
h2{font-family:var(--display);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--amber);margin:0 0 6px}
#tabs{display:flex;gap:5px;justify-content:space-between;margin-bottom:8px}
#tabs button{width:38px;height:38px;padding:2px;border-radius:50%;border:2px solid transparent;background:rgba(255,255,255,.07)}
#tabs button[aria-pressed=true]{border-color:var(--amber);background:rgba(255,192,74,.18)}
#tabs canvas{width:100%;height:100%;display:block}
#catname{font-family:var(--display);font-weight:700;font-size:20px;line-height:1;margin:2px 0 8px}
#palette{display:grid;grid-template-columns:1fr 1fr;gap:8px;overflow:auto;padding:2px;align-content:start}
#palette button{position:relative;display:grid;justify-items:center;gap:0;padding:4px 4px 6px;border-radius:16px;border:2px solid transparent;background:radial-gradient(circle at 50% 38%,rgba(111,211,255,.20),rgba(255,255,255,.04) 70%);touch-action:none;user-select:none;transition:transform .12s,border-color .12s}
#palette button[hidden]{display:none}
#palette button:hover{transform:scale(1.06);border-color:var(--amber)}
#palette canvas{width:86px;height:86px;display:block;pointer-events:none}
#palette span{font-size:12px;font-weight:500;line-height:1.15;text-align:center}
#palette em{position:absolute;top:5px;right:6px;font-style:normal;font-family:var(--display);font-weight:700;font-size:12px;background:var(--amber);color:var(--ink);border-radius:999px;padding:0 6px;line-height:17px}
body:not([data-mode=build]) #left{opacity:.4;pointer-events:none}
#modes{position:absolute;z-index:3;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:5px;backdrop-filter:blur(10px)}
#modes button{font-family:var(--display);font-weight:600;font-size:15px;background:none;border:0;border-radius:999px;padding:5px 18px;color:var(--muted)}
#modes button[aria-pressed=true]{background:var(--amber);color:var(--ink)}
#dnabox{position:absolute;z-index:3;left:14px;bottom:14px;width:232px;background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:10px 14px;backdrop-filter:blur(10px)}
#dnabox div{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--display);font-weight:700}
#dnabox span{font-size:13px;letter-spacing:.06em;color:var(--amber)}#dna{font-size:18px;font-variant-numeric:tabular-nums}
#meter{height:10px;border-radius:10px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:4px}#meter i{display:block;height:100%;background:linear-gradient(90deg,var(--moss),var(--amber));border-radius:10px;transition:width .15s}
#meter.over i{background:var(--danger)}
#hint{position:absolute;z-index:3;left:50%;bottom:16px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 560px);min-width:220px;text-align:center;background:var(--glass);border-radius:999px;padding:7px 18px;font-size:13px;pointer-events:none}
#ghost{position:fixed;z-index:9;width:104px;height:104px;margin:-52px 0 0 -52px;pointer-events:none;display:none;filter:drop-shadow(0 8px 12px rgba(0,0,0,.55))}
#name{width:100%;font-family:var(--display);font-weight:700;font-size:21px;color:var(--paper);background:none;border:0;border-bottom:2px dashed var(--line);padding:0 0 2px;margin-bottom:12px}
#panel{display:grid;gap:13px}
section{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:12px}
#panel section:first-child{border-top:0;padding-top:0}
.row{display:grid;grid-template-columns:70px 1fr;align-items:center;gap:10px}
.row label,.row>span,.note{color:var(--muted)}.note{margin:0;line-height:1.45;font-size:13px}
input[type=range]{width:100%;accent-color:var(--amber)}
.cap{display:flex;justify-content:space-between;align-items:center;padding:2px 0}
.pips{display:flex;gap:4px}.pips i{width:17px;height:9px;border-radius:4px;background:rgba(255,255,255,.12)}.pips i.on{background:var(--moss)}
.warn{color:var(--danger);font-size:13px;margin-top:4px}
.seg,.chips{display:flex;flex-wrap:wrap;gap:5px}
.seg button,.chips button{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:999px;padding:4px 11px}
.seg button[aria-pressed=true],.chips button[aria-pressed=true]{background:var(--amber);border-color:var(--amber);color:var(--ink);font-weight:600}
.chips button:hover,.seg button:hover{border-color:var(--amber)}
.colors{display:flex;gap:8px}
input[type=color]{width:44px;height:28px;padding:0;border:1px solid var(--line);border-radius:8px;background:none;cursor:pointer}
@media (max-width:900px){body{overflow:auto}#stage{position:relative;inset:auto;height:58vh}.card,#dnabox{position:static;width:auto!important;max-height:none!important;margin:10px;border-radius:18px}#palette{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}#hint{max-width:92%}#dnabox{backdrop-filter:none}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="vendor/GLTFLoader.js"></script>
<link rel="stylesheet" href="studio.css">
</head>
<body data-mode="build">
<div id="stage"><canvas id="gl" tabindex="0" aria-label="Vista de la criatura"></canvas>
  <div id="modes" role="group" aria-label="Modo"><button data-mode="build" aria-pressed="true">Construir</button><button data-mode="paint" aria-pressed="false">Pintar</button><button data-mode="test" aria-pressed="false">Probar</button></div>
  <div id="hint"></div>
</div>
<canvas id="ghost" width="112" height="112" aria-hidden="true"></canvas>
<aside id="left" class="card"><div id="tabs" role="group" aria-label="Categorías de piezas"></div><div id="catname"></div><div id="palette"></div></aside>
<div id="dnabox"><div><span>ADN</span><b id="dna"></b></div><div id="meter"><i></i></div></div>
<aside id="right" class="card"><input id="name" aria-label="Nombre de la criatura" placeholder="Ponle nombre" maxlength="28"><div class="chips" id="toolbar"><button id="undo">Deshacer</button><button id="redo">Rehacer</button><button id="lang">EN</button></div><div id="panel"></div><section id="documents"></section><p id="message" role="status" aria-live="polite"></p></aside>
<script src="growth.js"></script>
<script src="genome.js"></script>
<script src="i18n.js"></script>
<script src="studio.js"></script>
</body>
</html>

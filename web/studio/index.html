<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Taller de criaturas</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: escena a sangre a la izquierda, banco de trabajo fijo a la derecha */
  --ink:#14110e; --bench:#1d1915; --paper:#f1e8d8; --muted:#a89c8a; --line:rgba(241,232,216,.14);
  --amber:#e9a13b; --moss:#8fae5a;
  --display:'Fraunces',Georgia,serif; --body:'Figtree',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--paper);font-family:var(--body);font-size:14px;display:flex;overflow:hidden}
#stage{position:relative;flex:1;min-width:0}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#hint{position:absolute;left:16px;bottom:14px;color:var(--paper);opacity:.75;font-size:13px;text-shadow:0 1px 8px rgba(0,0,0,.8);pointer-events:none}
#bench{width:340px;flex:none;background:var(--bench);border-left:1px solid var(--line);overflow:auto;padding:18px 16px 28px;display:grid;gap:16px;align-content:start}
h1{font-family:var(--display);font-weight:600;font-size:26px;margin:0;text-wrap:balance}
#bench>p{margin:-8px 0 0;color:var(--muted);line-height:1.45}
h2{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);margin:0 0 8px}
section{display:grid;gap:9px;border-top:1px solid var(--line);padding-top:14px}
.row{display:grid;grid-template-columns:108px 1fr;align-items:center;gap:10px}
.row label,.row>span{color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--amber)}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button,.chips button{font:inherit;color:var(--paper);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:7px;padding:5px 9px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--amber);border-color:var(--amber);color:var(--ink);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button:hover,.seg button:hover{border-color:var(--amber)}
.chips button.go{background:var(--moss);border-color:var(--moss);color:var(--ink);font-weight:600}
.colors{display:flex;gap:8px}
input[type=color]{width:44px;height:28px;padding:0;border:1px solid var(--line);border-radius:7px;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--paper);outline-offset:2px}
.tools{display:flex;flex-wrap:wrap;gap:6px}
.tools button{font:inherit;font-size:13px;color:var(--paper);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:7px;padding:5px 9px;cursor:pointer}
.tools button:hover{border-color:var(--amber)}.tools button:disabled{opacity:.35;cursor:default}
#lang{margin-left:auto}
#dna{display:grid;gap:6px}
#dna .top{display:flex;justify-content:space-between;align-items:baseline;font-variant-numeric:tabular-nums}
#dna .top b{font-family:var(--display);font-size:22px;font-weight:600}
#dna .meter{height:8px;border-radius:8px;background:rgba(255,255,255,.08);overflow:hidden}
#dna .meter i{display:block;height:100%;background:var(--moss);border-radius:8px;transition:width .2s,background .2s}
#dna.over .meter i{background:#e0533d}#dna.over .top b{color:#ff8a70}
#dna small{color:var(--muted)}
#stats{display:grid;grid-template-columns:1fr 1fr;gap:5px 14px}
.st{display:grid;grid-template-columns:1fr auto;gap:2px;font-size:12.5px}
.st span{color:var(--muted)}
.st i{grid-column:1/-1;height:5px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden}
.st i b{display:block;height:100%;border-radius:5px;background:var(--amber)}
.lv{display:flex;gap:3px;margin-top:2px}
.lv button{font:inherit;font-size:11px;width:22px;height:20px;padding:0;color:var(--muted);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:5px;cursor:pointer}
.lv button[aria-pressed=true]{background:var(--paper);color:var(--ink);border-color:var(--paper);font-weight:600}
textarea{width:100%;min-height:120px;background:rgba(0,0,0,.35);color:var(--paper);border:1px solid var(--line);border-radius:7px;font:12px ui-monospace,Menlo,monospace;padding:8px}
#msg{color:var(--moss);font-size:12.5px;min-height:1.2em}
.growth-note{margin:0;color:var(--muted);font-size:12px;line-height:1.5}
.region-list{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.region-list button{font:inherit;text-align:left;color:var(--paper);background:transparent;border:1px solid var(--line);border-radius:7px;padding:9px;min-height:44px;cursor:pointer}
.region-list button small{display:block;color:var(--muted);margin-top:3px}
.region-list button[aria-pressed=true]{border-color:var(--amber);background:rgba(233,161,59,.1)}
.region-list button:hover{border-color:var(--amber)}
::selection{background:var(--amber);color:var(--ink)}
#bench{scrollbar-color:var(--muted) var(--bench)}
.tools button[aria-pressed=true]{background:var(--amber);border-color:var(--amber);color:var(--ink)}
.slider{display:flex;align-items:center;gap:8px;min-width:0}.slider output{min-width:3ch;text-align:right;font-size:12px;font-variant-numeric:tabular-nums;color:var(--paper)}
#gl:focus-visible{outline:2px solid var(--amber);outline-offset:-3px}
@media (max-width:820px){body{flex-direction:column;overflow:hidden}#stage{flex:none;height:48%}#bench{width:auto;flex:1;min-height:0;border-left:0;border-top:1px solid var(--line);overflow:auto}.seg button,.chips button,.tools button{min-height:44px}input[type=range]{min-height:32px}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="growth.js"></script>

<body>
<div id="stage"><canvas id="gl" tabindex="0" aria-label="Vista de la criatura"></canvas><div id="hint">Arrastra para girar · rueda para acercar</div></div>
<aside id="bench">
  <div class="tools"><button id="undo" data-i="undo">Deshacer</button><button id="redo" data-i="redo">Rehacer</button><button id="lang" aria-label="Language">EN</button></div>
  <h1 data-i="title">Taller de criaturas</h1>
  <p data-i="lede">Piezas de biblioteca, deformación en directo y andar procedural. Ningún movimiento está animado a mano.</p>

</aside>
<script>
(()=>{
const T=THREE,$=id=>document.getElementById(id),V=(x,y,z)=>new T.Vector3(x,y,z);

 Cazador:{body:2.6,girth:.78,neck:1.1,tail:4.2,pairs:1,leg:2.3,legW:.24,head:.74,eye:.24,mouth:'fauces',horns:'ninguno',back:'púas',tailTip:'lisa',pat:1,cA:'#9a3b28',cB:'#2a1414',cC:'#e6cfa0',wet:.3,scale:7,speed:3},

function fresh(p){
  const f=JSON.parse(JSON.stringify({...DEF,...p,lv:{...DEF.lv,...(p.lv||{})}}));
  if(!Array.isArray(f.regions)){
    f.regions=[];
    if(f.growth!=='ninguno'){
      const region={id:'region-1',...regionDefaults,family:GROWTH_IDS[f.growth]};
      for(const[k,field]of Object.entries(GROWTH_FIELDS))if(f[k]!==undefined)region[field]=k==='growthMirror'?!!f[k]:f[k];
      f.regions.push(region);

  }
  for(const k of Object.keys(f))if(k.startsWith('growth'))delete f[k];
  return f;
}
const P=fresh(PRESETS.Cazador);
let selectedRegionId=null;
const selectedRegion=()=>P.regions.find(r=>r.id===selectedRegionId)||null;
function selectRegion(id){selectedRegionId=P.regions.some(r=>r.id===id)?id:P.regions[0]?.id||null}
function addRegion(source={}){let n=1;while(P.regions.some(r=>r.id==='region-'+n))n++;const r={...regionDefaults,...source,id:'region-'+n};P.regions.push(r);selectedRegionId=r.id;return r}
function controlValue(k){const r=selectedRegion();if(k==='growth')return r?Object.keys(GROWTH_IDS).find(x=>GROWTH_IDS[x]===r.family):'ninguno';if(k==='growthMirror')return +(r?.mirror??true);return GROWTH_FIELDS[k]?r?.[GROWTH_FIELDS[k]]??regionDefaults[GROWTH_FIELDS[k]]:P[k]}
function setControl(k,v){
  if(k==='growth'){
    if(v==='ninguno'){P.regions=P.regions.filter(r=>r.id!==selectedRegionId);selectRegion(null)}
    else{const r=selectedRegion()||addRegion();r.family=GROWTH_IDS[v]}
  }else if(GROWTH_FIELDS[k]){const r=selectedRegion();if(r)r[GROWTH_FIELDS[k]]=k==='growthMirror'?!!v:v}
  else P[k]=v;
}
const LV=k=>.8+.1*(P.lv[k]||1);
const UI=[
 ['Generar detalles',[['growth','Forma',['ninguno','ramas','placas','filamentos']],['growthSurface','Superficie',['torso','neck','tail']],['growthPos','Posición',0,1,.01],['growthSpan','Cobertura',0,1,.01],['growthAngle','Ángulo',-3.14,3.14,.01],['growthLength','Largo',.2,2.4,.05],['growthCount','Cantidad',1,18,1],['growthCurve','Curvatura',-1,1,.05],['growthBranches','Ramas',0,3,1],['growthMirror','Simetría',['Simple','Espejo'],1]]],
 ['Cuerpo',[['body','Torso',1.6,5,.05],['girth','Grosor',.45,1.5,.01],['neck','Cuello',.4,3.4,.05],['tail','Cola',.8,5.5,.05]]],
 ['Patas',[['pairs','Pares',1,3,1],['leg','Largo',.8,3.2,.05],['legW','Grosor',.12,.42,.01],['speed','Paso',0,4.5,.1]]],
 ['Cabeza',[['head','Tamaño',.4,1,.01],['eye','Ojos',.14,.38,.01],['mouth','Boca',['romo','fauces','pico']],['horns','Cuernos',['ninguno','par','nasal','corona']]]],
 ['Brazos',[['arms','Brazos',['ninguno','garras','manos']],['armL','Largo',.3,1.4,.02]]],
 ['Lomo y cola',[['back','Lomo',['liso','púas','placas','vela']],['tailTip','Punta',['lisa','maza','púas']]]],
 ['Piel',[['pat','Dibujo',['liso','rayas','manchas','veteado'],1],['colors','Colores'],['scale','Escama',3,14,.5],['wet','Brillo',0,1,.01]]]];

const renderer=new T.WebGLRenderer({canvas:$('gl'),antialias:true});
renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;

const scene=new T.Scene(),camera=new T.PerspectiveCamera(42,1,.1,2000);
const FOG=[.93,.74,.56],SUN=V(-.62,.3,-.72).normalize();

const skyMat=()=>new T.ShaderMaterial({side:T.BackSide,depthWrite:false,fog:false,toneMapped:false,uniforms:{sun:{value:SUN}},
  vertexShader:'varying vec3 d;void main(){d=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'varying vec3 d;uniform vec3 sun;void main(){vec3 n=normalize(d);float h=n.y;vec3 c=mix(vec3(.93,.74,.56),vec3(.50,.60,.78),smoothstep(0.,.28,h));c=mix(c,vec3(.17,.30,.58),smoothstep(.2,.95,h));c=mix(c,vec3(.30,.24,.18),step(h,0.)*.6);float s=max(dot(n,sun),0.);c+=vec3(1.,.62,.28)*pow(s,7.)*.55+vec3(1.,.9,.7)*pow(s,60.)*.5+vec3(1.,.97,.9)*smoothstep(.9988,.9995,s)*3.;gl_FragColor=vec4(c,1.);}'});
const sky=new T.Mesh(new T.SphereGeometry(1500,32,20),skyMat());sky.renderOrder=-1;scene.add(sky);
{const es=new T.Scene(),sg=new T.SphereGeometry(50,32,20),p=sg.attributes.position,c=new Float32Array(p.count*3),hz=new T.Color(.9,.55,.3),mid=new T.Color(.32,.42,.62),top=new T.Color(.08,.16,.4),gd=new T.Color(.12,.09,.06),tc=new T.Color();
  for(let i=0;i<p.count;i++){const h=p.getY(i)/50;if(h<0)tc.copy(hz).lerp(gd,sstep(0,.15,-h));else tc.copy(hz).lerp(mid,sstep(0,.3,h)).lerp(top,sstep(.25,.95,h));c.set([tc.r,tc.g,tc.b],i*3)}
  sg.setAttribute('color',new T.BufferAttribute(c,3));es.add(new T.Mesh(sg,new T.MeshBasicMaterial({vertexColors:true,side:T.BackSide})));
  const sm=new T.Mesh(new T.SphereGeometry(5,16,12),new T.MeshBasicMaterial({color:new T.Color(14,8,3.5)}));sm.position.copy(SUN).multiplyScalar(44);es.add(sm);
  const pm=new T.PMREMGenerator(renderer);scene.environment=pm.fromScene(es,.03).texture;pm.dispose()}
scene.add(new T.HemisphereLight(lin('#9db8e8'),lin('#5a4630'),.35));
const sun=new T.DirectionalLight(lin('#ffcf9a'),3.1);sun.position.copy(SUN).multiplyScalar(80);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
{const c=sun.shadow.camera;c.left=c.bottom=-17;c.right=c.top=17;c.near=10;c.far=200;sun.shadow.bias=-.0004;sun.shadow.normalBias=.05;sun.shadow.radius=3}scene.add(sun);

const NOISE='float hsh(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hsh(i),hsh(i+vec2(1.,0.)),f.x),mix(hsh(i+vec2(0.,1.)),hsh(i+vec2(1.,1.)),f.x),f.y);}\n';
const RC=6; /* radio del sendero */
const ground=new T.Mesh(new T.CircleGeometry(700,72).rotateX(-Math.PI/2),new T.MeshStandardMaterial({roughness:1}));ground.receiveShadow=true;scene.add(ground);
ground.material.onBeforeCompile=s=>{s.vertexShader='varying vec3 vWp;\n'+s.vertexShader.replace('#include <begin_vertex>','#include <begin_vertex>\nvWp=(modelMatrix*vec4(transformed,1.)).xyz;');
  s.fragmentShader='varying vec3 vWp;\n'+NOISE+s.fragmentShader.replace('#include <color_fragment>',`float r=length(vWp.xz),n=vn(vWp.xz*.6)*.6+vn(vWp.xz*2.9)*.4;float tr=smoothstep(3.7,4.7,r+n*.8)*(1.-smoothstep(7.3,8.3,r-n*.8));
   vec3 dirt=mix(vec3(.13,.085,.05),vec3(.26,.18,.11),n)*(.8+.4*vn(vWp.xz*11.));vec3 gr=mix(vec3(.035,.085,.02),vec3(.08,.15,.035),n);diffuseColor.rgb=mix(gr,dirt,tr);`)};
/* hierba: brizna instanciada con viento, no cubre el sendero */
{const N=120000,a=new Float32Array(N*4),r0=rngFrom(5);let k=0;
 while(k<N){const an=r0()*6.2832,r=Math.sqrt(r0())*62;if(r>3.9&&r<8.1)continue;const e=Math.min(Math.abs(r-3.9),Math.abs(r-8.1));a.set([Math.sin(an)*r,Math.cos(an)*r,r0(),(.35+r0()*.6)*(.45+.55*sstep(0,2.5,e))],k*4);k++}
 const g=new T.InstancedBufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute([-.5,0,0,.5,0,0,-.34,.5,0,.34,.5,0,0,1,0],3));g.setIndex([0,1,2,2,1,3,2,3,4]);g.setAttribute('inst',new T.InstancedBufferAttribute(a,4));g.instanceCount=N;
 var grassU={uTime:{value:0},fogC:{value:V(...FOG)}};
 const m=new T.Mesh(g,new T.ShaderMaterial({side:T.DoubleSide,toneMapped:false,uniforms:grassU,
  vertexShader:`attribute vec4 inst;uniform float uTime;varying float vH;varying float vD;varying float vR;void main(){vec2 b=inst.xy;float rnd=inst.z,hg=inst.w,ang=rnd*44.;
   float gust=sin(b.x*.14+b.y*.1+uTime*1.5)+sin(b.x*.33-b.y*.29+uTime*2.2)*.5;vec3 p=position;float bend=(.1+.16*gust)*p.y*p.y*hg,wd=.08*(.6+rnd);
   vec3 wp=vec3(b.x+p.x*cos(ang)*wd+bend*.85,p.y*hg,b.y+p.x*sin(ang)*wd+bend*.5);vH=p.y;vR=rnd+gust*.15;vec4 mv=viewMatrix*vec4(wp,1.);vD=-mv.z;gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`uniform vec3 fogC;varying float vH;varying float vD;varying float vR;void main(){vec3 c=mix(vec3(.10,.19,.05),mix(vec3(.50,.56,.17),vec3(.78,.66,.26),vR*.6),vH*vH);gl_FragColor=vec4(mix(c,fogC,smoothstep(35.,560.,vD)),1.);}`}));
 m.frustumCulled=false;scene.add(m)}
function rngFrom(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
/* rocas y sierras */
{const r0=rngFrom(11),rm=new T.MeshStandardMaterial({vertexColors:true,roughness:.92});
 const rock=(x,z,s,sy)=>{const g=new T.SphereGeometry(1,26,18),p=g.attributes.position,c=new Float32Array(p.count*3),o=r0()*50;
   for(let i=0;i<p.count;i++){const x0=p.getX(i),y0=p.getY(i),z0=p.getZ(i),d=1+.22*Math.sin(x0*3+o)*Math.cos(z0*2.6+o)+.13*Math.sin(y0*5+x0*4+o);p.setXYZ(i,x0*d,y0*d*sy,z0*d)}
   g.computeVertexNormals();const n=g.attributes.normal,gr=lin('#6f675c'),ms=lin('#4a5a28');for(let i=0;i<p.count;i++){const t=sstep(.55,.9,n.getY(i)),v=.8+.3*r0();c.set([lerp(gr.r,ms.r,t)*v,lerp(gr.g,ms.g,t)*v,lerp(gr.b,ms.b,t)*v],i*3)}
   g.setAttribute('color',new T.BufferAttribute(c,3));const m=new T.Mesh(g,rm);m.position.set(x,s*sy*.25,z);m.scale.setScalar(s);m.rotation.y=r0()*6;m.castShadow=m.receiveShadow=true;scene.add(m)};

   ['Golpear',c5((has('tailTip','maza')?L('tailTip')*.9:has('tailTip','púas')?L('tailTip')*.8:0)+(has('arms','garras')?L('arms')*.6:0)+(has('back','púas')?.5:0))],
   ['Cantar',c5(has('mouth','pico')?1.2+L('mouth')*.6:has('mouth','romo')?.6+L('mouth')*.3:.3)],
   ['Bailar',c5(P.leg*.7+(has('arms','manos')?L('arms')*.5:has('arms','garras')?.3:0)+(P.pairs===1?.6:0))],
   ['Encanto',c5(eye*2+(P.pat?0.8:0)+(has('back','vela')?.8:0))],
   ['Posar',c5((has('back','vela')?1+L('back')*.7:0)+(has('horns','corona')?.6+L('horns')*.5:has('horns','par')?L('horns')*.4:0))],
   ['Salud',c5(1+m*.55+(has('back','placas')?L('back')*.6:0))],
   ['Sigilo',c5(4.5-m*.45-(has('back','vela')?1:0)+(P.pat>=2?.8:0))],
   ['Vista',c5(eye*4+.5)]]}
function cost(){let c=10+P.body*3+P.neck*2+P.tail*1.5+P.pairs*8*(P.leg/2)+(P.pat?3:0);
  for(const k of PART_SLOTS)if(P[k]!==NONE[k])c+=8+6*(P.lv[k]||1);return Math.round(c)}
function drawPanel(){const st=abilities();$('stats').innerHTML=st.map(([n,v])=>`<div class="st"><span>${tr(n)}</span><b>${v.toFixed(1)}</b><i><b style="width:${v/5*100}%"></b></i></div>`).join('');
  const c=cost(),ov=c>BUDGET;$('cost').textContent=c;$('budget').textContent=BUDGET;$('meter').style.width=Math.min(100,c/BUDGET*100)+'%';$('dna').classList.toggle('over',ov);
  $('dnanote').textContent=tr(ov?'Supera el presupuesto: el núcleo rechazará este diseño (no se recorta).':'Dentro del presupuesto de la fase final del estadio criatura.');
  if(document.activeElement!==$('json'))$('json').value=JSON.stringify(toGenome(),null,1)}
function toGenome(){const r=v=>Math.round(v*1000)/1000;
  return{schema:'cpore.creature/3',body:{torso:r(P.body),girth:r(P.girth),neck:r(P.neck),tail:r(P.tail)},legs:{pairs:P.pairs,length:r(P.leg),width:r(P.legW),stride:r(P.speed)},
   head:{size:r(P.head),eyes:r(P.eye)},arms:{length:r(P.armL)},parts:PART_SLOTS.filter(k=>P[k]!==NONE[k]).map(k=>({slot:k,type:IDS[k][P[k]],level:P.lv[k]||1})),
   skin:{pattern:PAT_IDS[P.pat],colors:{base:P.cA,pattern:P.cB,belly:P.cC},scale:r(P.scale),gloss:r(P.wet)},
   regions:P.regions.map(x=>({id:x.id,schema:CreatureGrowth.VERSION,...growthRecipe(x),surface:x.surface,position:r(x.position),coverage:r(x.coverage),angle:r(x.angle),mirror:x.mirror})),
   dna:cost(),abilities:Object.fromEntries(abilities().map(([n,v])=>[EN[n].toLowerCase(),v]))}}
/* valida contra los rangos del banco; un genoma fuera de rango se rechaza con la lista de errores (DESIGN.md Q11) */
function fromGenome(g){const err=[],out=fresh({}),R={};for(const[,rows]of UI)for(const[k,,a,b]of rows)if(!Array.isArray(a)&&k!=='colors')R[k]=[a,b];
  const num=(k,v,target=out,field=k)=>{if(typeof v!=='number'||!isFinite(v))return err.push(`${k}: not a number`);if(R[k]&&(v<R[k][0]-1e-9||v>R[k][1]+1e-9))return err.push(`${k}: ${v} outside [${R[k][0]}, ${R[k][1]}]`);target[field]=v};
  if(!g||!['cpore.creature/1','cpore.creature/2','cpore.creature/3'].includes(g.schema))err.push('schema must be cpore.creature/1, /2 or /3');else{
   num('body',g.body?.torso);num('girth',g.body?.girth);num('neck',g.body?.neck);num('tail',g.body?.tail);num('pairs',g.legs?.pairs);num('leg',g.legs?.length);num('legW',g.legs?.width);num('speed',g.legs?.stride);
   num('head',g.head?.size);num('eye',g.head?.eyes);num('armL',g.arms?.length??.7);num('scale',g.skin?.scale);num('wet',g.skin?.gloss);
   let sources=[];
   if(g.schema==='cpore.creature/3'){
     if(!Array.isArray(g.regions))err.push('regions: expected an array');else if(g.regions.length>64)err.push('regions: this editor supports up to 64 regions');else sources=g.regions;
   }else if(g.growth!==undefined){sources=[g.growth&&{...g.growth,id:'region-1',surface:'torso'}]}
   else if(g.schema==='cpore.creature/2')err.push('growth: required in cpore.creature/2');
   const ids=new Set();
   for(const x of sources){
     if(!x||x.schema!==CreatureGrowth.VERSION){err.push('region: unsupported recipe schema');continue}
     const region={...regionDefaults,id:x.id};
     if(typeof x.id!=='string'||!/^[-a-zA-Z0-9_]{1,64}$/.test(x.id)||ids.has(x.id))err.push('region.id: expected a unique identifier (1–64 letters, digits, underscores or hyphens)');
     ids.add(x.id);
     const legacyNone=g.schema!=='cpore.creature/3'&&x.family==='none';
     if(!['horns','plates','tendrils'].includes(x.family)&&!legacyNone)err.push('region.family: unknown family');else region.family=x.family;
     if(!['torso','neck','tail'].includes(x.surface))err.push('region.surface: expected torso, neck or tail');else region.surface=x.surface;
     for(const[k,field]of Object.entries(GROWTH_FIELDS))if(!['growthMirror','growthSeed','growthSurface'].includes(k))num(k,x[field],region,field);
     if(!Number.isInteger(x.seed)||x.seed<0||x.seed>4294967295)err.push('region.seed: expected uint32');else region.seed=x.seed;
     if(!Number.isInteger(x.count)||!Number.isInteger(x.branches))err.push('region: count and branches must be integers');
     if(typeof x.mirror!=='boolean')err.push('region.mirror: expected boolean');else region.mirror=x.mirror;
     if(!legacyNone)out.regions.push(region);
   }
   const pi=PAT_IDS.indexOf(g.skin?.pattern);if(pi<0)err.push('skin.pattern: one of '+PAT_IDS.join(', '));else out.pat=pi;
   for(const q of['base','pattern','belly'])if(!/^#[0-9a-f]{6}$/i.test(g.skin?.colors?.[q]||''))err.push(`skin.colors.${q}: #rrggbb`);
   if(!err.length){out.cA=g.skin.colors.base;out.cB=g.skin.colors.pattern;out.cC=g.skin.colors.belly}
   for(const k of PART_SLOTS)out[k]=NONE[k]??'romo';
   const parts=Array.isArray(g.parts)?g.parts:[];if(!Array.isArray(g.parts))err.push('parts: expected an array');
   for(const p of parts){if(!p||typeof p!=='object'){err.push('parts: expected an object');continue}const m=Object.hasOwn(IDS,p.slot)?IDS[p.slot]:null;if(!m){err.push(`parts: unknown slot ${p.slot}`);continue}
     const v=Object.keys(m).find(x=>m[x]===p.type);if(!v){err.push(`parts.${p.slot}: unknown type ${p.type}`);continue}
     if(!Number.isInteger(p.level)||p.level<1||p.level>5){err.push(`parts.${p.slot}: level 1-5`);continue}out[p.slot]=v;out.lv[p.slot]=p.level}
   if(!parts.some(p=>p?.slot==='mouth'))err.push('parts: a mouth is required')}
  if(err.length)throw new Error(err.join('\n'));return out}
const surfaceLabel=s=>({torso:'Torso',neck:'Cuello',tail:'Cola'})[s];
const familyLabel=f=>({horns:'Cuernos',plates:'Placas',tendrils:'Filamentos'})[f];
function regionPanel(){
  const active=selectedRegion();
  return `<div class="region-list" role="group" aria-label="${tr('Regiones')}">${P.regions.map((r,i)=>`<button data-region="${r.id}" aria-pressed="${r.id===selectedRegionId}">${tr(familyLabel(r.family))} ${i+1}<small>${tr(surfaceLabel(r.surface))} · ${tr(r.mirror?'Espejo':'Simple')}</small></button>`).join('')}</div>
  <div class="tools"><button data-growth-action="add" ${P.regions.length>=64?'disabled':''}>${tr('Añadir región')}</button>${active?`<button data-growth-action="duplicate" ${P.regions.length>=64?'disabled':''}>${tr('Duplicar')}</button><button data-growth-action="delete">${tr('Eliminar')}</button>`:''}</div>
  ${active?`<div class="tools"><button id="placeGrowth" data-growth-action="place" aria-pressed="${editTool==='growth'}">${tr('Colocar en el cuerpo')}</button><button data-growth-action="vary">${tr('Nueva variante')}</button></div>`:''}`;
}
function drawUI(){selectRegion(selectedRegionId);$('ui').innerHTML=UI.map(([title,rows])=>`<section><h2>${tr(title)}</h2>${title==='Generar detalles'?regionPanel():''}${rows.filter(([k])=>title!=='Generar detalles'||k==='growth'||selectedRegion()&&(k!=='growthBranches'||controlValue('growth')!=='placas')).map(([k,label,a,b,c])=>
  k==='colors'?`<div class="row"><span>${tr(label)}</span><div class="colors">${['cA','cB','cC'].map((q,i)=>`<input type="color" id="c-${q}" data-col="${q}" value="${P[q]}" aria-label="${['base','pattern','belly'][i]}">`).join('')}</div></div>`
  :Array.isArray(a)?`<div class="row"><span>${tr(label)}</span><div><div class="seg">${a.map((o,i)=>`<button id="s-${k}-${i}" data-seg="${k}" data-v="${b?i:o}" aria-pressed="${String(controlValue(k))===String(b?i:o)}">${tr(k==='growthSurface'?surfaceLabel(o):o)}</button>`).join('')}</div>${PART_SLOTS.includes(k)&&P[k]!==NONE[k]?`<div class="lv" role="group" aria-label="${tr('Nivel')}">${[1,2,3,4,5].map(n=>`<button data-lv="${k}" data-n="${n}" aria-pressed="${P.lv[k]===n}">${n}</button>`).join('')}</div>`:''}</div></div>`
  :`<div class="row"><label for="r-${k}">${tr(label)}</label><div class="slider"><input type="range" id="r-${k}" data-k="${k}" min="${a}" max="${b}" step="${c}" value="${controlValue(k)}"><output id="v-${k}" for="r-${k}">${controlValue(k)}</output></div></div>`).join('')}${title==='Generar detalles'?`<p class="growth-note">${tr(selectedRegion()?'Cada región conserva su forma, posición y simetría.':'Crea cuernos, placas o filamentos con geometría nueva.')}</p>${selectedRegion()?`<p class="growth-note">${tr('Semilla')} ${controlValue('growthSeed')} · ${tr('Detalles artísticos; no cambian las capacidades.')}</p>`:''}`:''}</section>`).join('');
  document.querySelectorAll('[data-i]').forEach(el=>{el.dataset.es=el.dataset.es||el.textContent;el.textContent=tr(el.dataset.es)});$('lang').textContent=lang==='es'?'EN':'ES';document.documentElement.lang=lang;
  $('presets').innerHTML=Object.keys(PRESETS).map(n=>`<button data-p="${n}">${tr(n)}</button>`).join('')+`<button class="go" id="rand">${tr('Al azar')}</button>`;drawPanel();syncEditTool()}
/* historial y autoguardado */
const hist=[],fut=[];let lastSnap='';
function commit(){const s=JSON.stringify(P);if(s===lastSnap)return;if(lastSnap)hist.push(lastSnap);if(hist.length>100)hist.shift();fut.length=0;lastSnap=s;try{localStorage.setItem('cpore.creature',s)}catch(e){}tools()}
function tools(){$('undo').disabled=!hist.length;$('redo').disabled=!fut.length}
let pendingBuild=0;
function scheduleBuild(){if(!pendingBuild)pendingBuild=requestAnimationFrame(()=>{pendingBuild=0;build()})}
function flushBuild(resetCamera=false){if(pendingBuild){cancelAnimationFrame(pendingBuild);pendingBuild=0}build(resetCamera)}
function restore(s){drag=null;const p=JSON.parse(s);for(const k in P)delete P[k];Object.assign(P,p);lastSnap=s;drawUI();syncSkin();flushBuild();try{localStorage.setItem('cpore.creature',s)}catch(e){}tools()}
$('undo').addEventListener('click',()=>{if(hist.length){fut.push(lastSnap);restore(hist.pop())}});
$('redo').addEventListener('click',()=>{if(fut.length){hist.push(lastSnap);restore(fut.pop())}});
addEventListener('keydown',e=>{if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT'&&e.target.type!=='range')return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();$(e.shiftKey?'redo':'undo').click()}});
$('lang').addEventListener('click',()=>{lang=lang==='es'?'en':'es';try{localStorage.setItem('cpore.lang',lang)}catch(e){}drawUI()});
function syncSkin(){SU.cA.value.copy(lin(P.cA));SU.cB.value.copy(lin(P.cB));SU.cC.value.copy(lin(P.cC));SU.uPat.value=P.pat;SU.uWet.value=P.wet;SU.uScale.value=P.scale;skinM.clearcoat=skinM2.clearcoat=P.wet*.8}
$('ui').addEventListener('input',e=>{const t=e.target;if(t.dataset.k){const k=t.dataset.k;setControl(k,+t.value);const out=$('v-'+k);if(out)out.value=controlValue(k);if(k.startsWith('growth'))growthDirty=true;else if(['wet','scale'].includes(k))syncSkin();else if(k!=='speed')scheduleBuild();drawPanel()}if(t.dataset.col){P[t.dataset.col]=t.value;syncSkin();drawPanel()}});
$('ui').addEventListener('change',commit);
$('ui').addEventListener('click',e=>{
  const regionButton=e.target.closest('[data-region]');if(regionButton){selectRegion(regionButton.dataset.region);drawUI();document.querySelector(`[data-region="${selectedRegionId}"]`)?.focus({preventScroll:true});return}
  const action=e.target.closest('[data-growth-action]')?.dataset.growthAction;
  if(action==='add'||action==='duplicate'){if(P.regions.length>=64)return;const source=action==='duplicate'?selectedRegion():{coverage:.25,count:5};if(!source)return;addRegion(source);growthDirty=true;editTool='growth';drawUI();commit();gl.focus({preventScroll:true});return}
  if(action==='delete'){setControl('growth','ninguno');growthDirty=true;drawUI();commit();document.querySelector('[data-region][aria-pressed=true], [data-growth-action=add]')?.focus({preventScroll:true});return}
  if(action==='place'){editTool=editTool==='growth'?'orbit':'growth';syncEditTool();if(editTool==='growth')gl.focus();return}
  if(action==='vary'){setControl('growthSeed',(controlValue('growthSeed')+1)>>>0);growthDirty=true;drawUI();commit();document.querySelector('[data-growth-action=vary]')?.focus({preventScroll:true});return}
  const l=e.target.closest('[data-lv]');if(l){P.lv[l.dataset.lv]=+l.dataset.n;drawUI();scheduleBuild();commit();return}
  const t=e.target.closest('[data-seg]');if(!t)return;const k=t.dataset.seg;setControl(k,['pat','pairs','growthMirror'].includes(k)?+t.dataset.v:t.dataset.v);const id=t.id;drawUI();if(k==='pat')syncSkin();else if(k.startsWith('growth'))growthDirty=true;else scheduleBuild();commit();$(id)?.focus({preventScroll:true})});
/* every value snaps to its slider step, as the UI would, so a genome round-trips exactly */
const quant=f=>{for(const[,rows]of UI)for(const[k,,a,b,c]of rows)if(!Array.isArray(a)&&k!=='colors'){const targets=GROWTH_FIELDS[k]?f.regions:[f],field=GROWTH_FIELDS[k]||k;for(const target of targets)if(typeof target[field]==='number'){const n=Math.round((clamp(target[field],a,b)-a)/c);target[field]=+(a+n*c).toFixed(4)}}return f};
function load(p){drag=null;editTool='orbit';const f=quant(fresh(p));for(const k in P)delete P[k];Object.assign(P,f);drawUI();syncSkin();flushBuild(true);commit()}
const say=t=>{$('msg').textContent=t;clearTimeout(say.t);say.t=setTimeout(()=>$('msg').textContent='',4000)};
$('presets').addEventListener('click',e=>{const n=e.target.dataset.p;if(n)load(PRESETS[n]);if(e.target.id==='rand'){const seed=(Date.now()^(Math.random()*1e9))>>>0,r=rngFrom(seed),pick=a=>a[r()*a.length|0],pal=pick([['#9a3b28','#2a1414','#e6cfa0'],['#2f8a5a','#12382c','#e9e2a8'],['#3d5fa8','#8a4fb0','#f0e6c8'],['#c9892b','#4a2a12','#f3e3b8'],['#6c7440','#2f3320','#d8cfa6'],['#22313f','#d9a441','#c8d2d8'],['#b84a6a','#3a1830','#f2d9c9']]);
  load({body:1.8+r()*2.6,girth:.55+r()*.8,neck:.5+r()*2.4,tail:1.2+r()*3.8,pairs:1+(r()*3|0),leg:.9+r()*2,legW:.15+r()*.22,head:.45+r()*.4,eye:.16+r()*.18,mouth:pick(['romo','fauces','pico']),horns:pick(['ninguno','par','nasal','corona']),back:pick(['liso','púas','placas','vela']),tailTip:pick(['lisa','maza','púas']),arms:pick(['ninguno','ninguno','garras','manos']),armL:.4+r()*.8,pat:r()*4|0,cA:pal[0],cB:pal[1],cC:pal[2],wet:r()*.7,scale:4+r()*8,speed:1.5+r()*2,
   lv:{mouth:1+(r()*5|0),horns:1+(r()*5|0),back:1+(r()*5|0),tailTip:1+(r()*5|0),arms:1+(r()*5|0)}});say(`${tr('Semilla')} ${seed}`)}});
$('export').addEventListener('click',()=>{const s=JSON.stringify(toGenome(),null,1);navigator.clipboard.writeText(s).then(()=>say(tr('Copiado al portapapeles')),()=>say(tr('El navegador no ha permitido copiar')))});
$('import').addEventListener('click',()=>{try{load(fromGenome(JSON.parse($('json').value)));say(tr('Diseño cargado'))}catch(e){say(tr('Genoma no válido')+': '+e.message)}});
const dl=(href,name)=>{const a=document.createElement('a');a.href=href;a.download=name;a.click()};
$('save').addEventListener('click',()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(toGenome(),null,1)],{type:'application/json'}));dl(u,'creature.json');setTimeout(()=>URL.revokeObjectURL(u),2000)});
$('shot').addEventListener('click',()=>{renderer.render(scene,camera);dl(renderer.domElement.toDataURL('image/png'),'creature.png');say(tr('Captura descargada'))});
$('share').addEventListener('click',()=>{const u=location.href.split('#')[0]+'#g='+btoa(unescape(encodeURIComponent(JSON.stringify(toGenome()))));navigator.clipboard.writeText(u).then(()=>say(tr('Copiado al portapapeles')),()=>say(tr('El navegador no ha permitido copiar')))});
window.CreatureStudio={genome:toGenome,load:g=>load(fromGenome(g)),abilities,cost,
  diagnostics:()=>({growthBuilds,growthBuildMs,growthPieces:growthParts.length,geometryCount:renderer.info.memory.geometries,camDist,editTool,selectedRegionId,regions:[...regionViews].map(([id,v])=>({id,builds:v.builds,pieces:v.parts.filter(p=>p.root.visible).length,buildMs:v.buildMs}))})};

let last=0;function loop(t){requestAnimationFrame(loop);const dt=Math.min(.05,(t-last)/1000||0);last=t;if(growthDirty)rebuildGrowth();update(dt);frameCam(dt);renderer.render(scene,camera)}
resize();{const h=new URLSearchParams(location.hash.slice(1));if(h.get('lang'))lang=h.get('lang')==='en'?'en':'es';
  let start=null;try{start=JSON.parse(localStorage.getItem('cpore.creature'))}catch(e){}
  if(PRESETS[h.get('preset')])start=PRESETS[h.get('preset')];
  if(h.get('g'))try{start=fromGenome(JSON.parse(decodeURIComponent(escape(atob(h.get('g'))))))}catch(e){console.warn('bad shared genome',e)}
  load(start||P)}update(0);frameCam(0,true);requestAnimationFrame(loop);
})();

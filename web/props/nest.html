<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Art Nest — Preview</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  #hud {
    position: absolute; top: 12px; left: 12px;
    background: rgba(0,0,0,0.7); color: #ccc; padding: 10px 14px;
    border-radius: 8px; font-size: 12px; line-height: 1.6;
    pointer-events: none; max-width: 320px;
  }
  #hud h2 { font-size: 14px; color: #f0c860; margin-bottom: 4px; }
  #hud .label { color: #aaa; }
  #hud .val { color: #fff; }
  #info {
    position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.6); color: #999; padding: 6px 14px;
    border-radius: 6px; font-size: 11px;
  }
  .label-line { color: #7a9a4a; }
</style>
</head>
<body>

<div id="hud">
  <h2>Art Nest — Preview</h2>
  <div><span class="label">Variants:</span> <span class="val">4 sites × 2 states = 8 nests</span></div>
  <div><span class="label">Palette:</span> <span class="val label-line">C "Current+" (G63)</span></div>
  <div><span class="label">Shader:</span> <span class="val">Toon (6-band ramp)</span></div>
  <div><span class="label">Draw calls:</span> <span class="val" id="dc">—</span></div>
  <div><span class="label">Triangles:</span> <span class="val" id="tris">—</span></div>
  <div><span class="label">FPS:</span> <span class="val" id="fps">—</span></div>
</div>
<div id="info">Orbit: left-click drag &nbsp;|&nbsp; Zoom: scroll &nbsp;|&nbsp; Pan: right-click drag</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/"
  }
}
</script>

<!-- OrbitControls inline (r128 compatible) -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script type="module">
import { buildNest, allVariants } from './nest.js';

// ── Scene setup ─────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 500);
camera.position.set(6, 5, 8);
camera.lookAt(0, 0.5, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

// ── Controls ────────────────────────────────────────────────────────────────
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.5, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2;
controls.maxDistance = 30;
controls.maxPolarAngle = Math.PI * 0.48;
controls.update();

// ── Lighting (golden look) ─────────────────────────────────────────────────
// Hemisphere light
const hemiLight = new THREE.HemisphereLight(0xa8ccf8, 0x6a6a5c, 0.5);
scene.add(hemiLight);

// Directional sun (golden hour)
const sun = new THREE.DirectionalLight(0xffd6a0, 3.2);
sun.position.set(-5, 3, -7);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -10;
sun.shadow.camera.right = 10;
sun.shadow.camera.top = 6;
sun.shadow.camera.bottom = -6;
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 30;
sun.shadow.bias = -0.0004;
scene.add(sun);

// Ambient fill
scene.add(new THREE.AmbientLight(0x404040, 0.3));

// ── Fog ─────────────────────────────────────────────────────────────────────
scene.fog = new THREE.Fog(0xdcdcdc, 20, 60);

// ── Build all nest variants ─────────────────────────────────────────────────
const allNests = allVariants(THREE, 42);
scene.add(allNests);

// ── Stats ───────────────────────────────────────────────────────────────────
let drawCalls = 0, triangles = 0;
allNests.traverse((obj) => {
  if (obj.isMesh || obj.isInstancedMesh) {
    if (obj.isInstancedMesh) {
      drawCalls++;
      if (obj.geometry && obj.geometry.index) triangles += obj.geometry.index.count / 3 * obj.count;
      else if (obj.geometry && obj.geometry.attributes.position) triangles += obj.geometry.attributes.position.count / 3 * obj.count;
    } else {
      drawCalls++;
      if (obj.geometry && obj.geometry.index) triangles += obj.geometry.index.count / 3;
      else if (obj.geometry && obj.geometry.attributes.position) triangles += obj.geometry.attributes.position.count / 3;
    }
  }
});
document.getElementById('dc').textContent = drawCalls;
document.getElementById('tris').textContent = Math.round(triangles).toLocaleString();

// ── Render loop ─────────────────────────────────────────────────────────────
let frameCount = 0, lastTime = performance.now();
function animate(time) {
  requestAnimationFrame(animate);
  controls.update();

  frameCount++;
  if (time - lastTime >= 1000) {
    document.getElementById('fps').textContent = frameCount;
    frameCount = 0;
    lastTime = time;
  }

  renderer.render(scene, camera);
}
animate();

// ── Resize ──────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>

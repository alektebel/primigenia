<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Primigenia — Valley Species</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a20; color: #c8c0b0; font-family: system-ui, sans-serif; overflow: hidden; }
  #view { width: 100vw; height: 100vh; display: block; }
  #hud {
    position: fixed; top: 12px; left: 12px; z-index: 10;
    background: rgba(20,18,24,0.85); border-radius: 8px; padding: 12px 16px;
    font-size: 13px; line-height: 1.6; max-width: 320px; pointer-events: none;
  }
  #hud h1 { font-size: 16px; color: #e8d8b0; margin-bottom: 4px; font-weight: 600; }
  #hud p { font-size: 12px; opacity: 0.7; margin: 2px 0; }
  #hud .species-name { color: #ffd6a0; font-weight: 600; }
  #controls {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 10;
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
  }
  #controls button {
    background: rgba(30,28,36,0.9); border: 1px solid rgba(200,180,140,0.3); color: #c8c0b0;
    padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 12px; font-family: inherit;
    transition: background 0.15s, border-color 0.15s;
  }
  #controls button:hover { background: rgba(50,45,56,0.95); border-color: rgba(200,180,140,0.6); }
  #controls button.active { background: rgba(80,70,90,0.95); border-color: #ffd6a0; color: #ffd6a0; }
  #stats {
    position: fixed; top: 12px; right: 12px; z-index: 10;
    background: rgba(20,18,24,0.85); border-radius: 8px; padding: 12px 16px;
    font-size: 12px; line-height: 1.7;
  }
  #stats .label { opacity: 0.6; }
  #stats .value { color: #ffd6a0; }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #1a1a20; z-index: 100; font-size: 18px; color: #e8d8b0;
  }
</style>
</head>
<body>

<div id="loading">Loading species…</div>
<canvas id="view"></canvas>

<aside id="hud">
  <h1>Primigenia — Valley Species</h1>
  <p>Genomes in <code>cpore.creature/4</code> · Rendered with shared skin material</p>
  <p>Click a name to focus that species. Scroll to zoom. Drag to orbit.</p>
  <p id="info"></p>
</aside>

<aside id="stats"></aside>

<div id="controls"></div>

<!-- Three.js r128 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- OrbitControls from CDN (r128 compatible) -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script type="module">
import { buildLineup, buildOne, buildSkinMat, countTriangles, countDrawCalls } from './species.js';

/* ---------- load species genomes -------------------------------------- */
const RESPONSES = await Promise.all([
  fetch('./species/rondo.json'),
  fetch('./species/zanco.json'),
  fetch('./species/espinodo.json'),
  fetch('./species/espinodo-nocturnal.json'),
  fetch('./species/espinodo-albino.json'),
]);
const genomes = await Promise.all(RESPONSES.map(r => r.json()));
console.log('Genomes loaded:', genomes.map(g => g.name));

/* ---------- scene ----------------------------------------------------- */
const canvas = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();

/* ---------- golden-hour lighting -------------------------------------- */
const sun = new THREE.DirectionalLight(0xffd6a0, 3.2);
sun.position.set(-60, 40, -80);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -40; sun.shadow.camera.right = 40;
sun.shadow.camera.top = 20;  sun.shadow.camera.bottom = -10;
sun.shadow.camera.near = 1;  sun.shadow.camera.far = 200;
sun.shadow.bias = -0.0004;
scene.add(sun);

const hemi = new THREE.HemisphereLight(0xa8ccf8, 0x6a6a5c, 0.5);
scene.add(hemi);

/* ---------- ground ---------------------------------------------------- */
const groundGeo = new THREE.PlaneGeometry(200, 200, 64, 64);
const gPos = groundGeo.attributes.position;
for (let i = 0; i < gPos.count; i++) {
  const x = gPos.getX(i), z = gPos.getY(i);
  gPos.setZ(i, (Math.sin(x * 0.05) * Math.cos(z * 0.05)) * 0.3 +
               (Math.sin(x * 0.12 + z * 0.08)) * 0.1);
}
groundGeo.computeVertexNormals();

const groundMat = new THREE.MeshStandardMaterial({
  color: new THREE.Color(0.18, 0.34, 0.07),
  roughness: 1.0,
  metalness: 0.0,
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.3;
ground.receiveShadow = true;
scene.add(ground);

/* ---------- grass tufts (instanced) ----------------------------------- */
const grassBladeGeo = new THREE.BufferGeometry();
grassBladeGeo.setAttribute('position', new THREE.Float32BufferAttribute([-0.5, 0, 0, 0.5, 0, 0, 0, 0.35, 0], 3));
grassBladeGeo.setIndex([0, 1, 2]);
grassBladeGeo.computeVertexNormals();

const grassMat = new THREE.MeshStandardMaterial({ color: 0x3a6828, roughness: 1, side: THREE.DoubleSide });
const grassCount = 3000;
const grassMesh = new THREE.InstancedMesh(grassBladeGeo, grassMat, grassCount);
const dummy = new THREE.Object3D();
const rng = (() => { let s = 12345; return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; })();

for (let i = 0; i < grassCount; i++) {
  const x = (rng() - 0.5) * 80;
  const z = (rng() - 0.5) * 60;
  dummy.position.set(x, -0.25, z);
  dummy.rotation.y = rng() * Math.PI * 2;
  const s = 0.6 + rng() * 0.8;
  dummy.scale.set(s, s * (0.7 + rng() * 0.6), s);
  dummy.updateMatrix();
  grassMesh.setMatrixAt(i, dummy.matrix);
}
grassMesh.castShadow = true;
grassMesh.receiveShadow = true;
scene.add(grassMesh);

/* ---------- build creatures ------------------------------------------- */
let lineup = null;
const speciesColors = {
  rondo: '#a09060',
  zanco: '#8a7a5a',
  espinodo: '#6a7040',
  'espinodo-nocturnal': '#2a2a38',
  'espinodo-albino': '#f0e8dc',
};

function build() {
  if (lineup) { scene.remove(lineup); lineup.traverse(c => { if (c.geometry) c.geometry.dispose(); if (c.material) { if (Array.isArray(c.material)) c.material.forEach(m => m.dispose()); else c.material.dispose(); } }); }
  lineup = buildLineup(THREE, genomes, { size: 1 });
  lineup.position.y = 0.05;
  scene.add(lineup);
}
build();

/* ---------- orbit controls -------------------------------------------- */
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.5, 500);
camera.position.set(12, 6, 12);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.5, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 60;
controls.maxPolarAngle = Math.PI * 0.48;
controls.update();

/* ---------- UI -------------------------------------------------------- */
const infoEl = document.getElementById('info');
const statsEl = document.getElementById('stats');
const controlsEl = document.getElementById('controls');
const names = genomes.map(g => g.name);

// Button bar
const btnAll = document.createElement('button');
btnAll.textContent = 'All'; btnAll.classList.add('active');
btnAll.addEventListener('click', () => {
  lineup.children.forEach(c => c.visible = true);
  infoEl.textContent = '';
  controlsEl.querySelectorAll('button').forEach(b => b.classList.remove('active'));
  btnAll.classList.add('active');
  controls.target.set(0, 2, 0);
  controls.minDistance = 3;
  controls.maxDistance = 60;
});
controlsEl.appendChild(btnAll);

const focusBtns = [];
names.forEach((name, i) => {
  const btn = document.createElement('button');
  btn.textContent = name;
  btn.style.borderLeftColor = speciesColors[Object.keys(speciesColors)[i]] || '#ffd6a0';
  btn.style.borderLeftWidth = '3px';
  btn.addEventListener('click', () => {
    lineup.children.forEach((c, j) => c.visible = (j === i));
    infoEl.innerHTML = `<span class="species-name">${name}</span> · ${countTriangles(lineup.children[i])} tris · ${countDrawCalls(lineup.children[i])} draws`;
    controlsEl.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    controls.target.set(0, 2, 0);
    controls.minDistance = 2;
    controls.maxDistance = 15;
  });
  controlsEl.appendChild(btn);
  focusBtns.push(btn);
});

// Reset view button
const resetBtn = document.createElement('button');
resetBtn.textContent = 'Reset';
resetBtn.addEventListener('click', () => {
  lineup.children.forEach(c => c.visible = true);
  infoEl.textContent = '';
  controlsEl.querySelectorAll('button').forEach(b => b.classList.remove('active'));
  btnAll.classList.add('active');
  controls.target.set(0, 2, 0);
  controls.minDistance = 3;
  controls.maxDistance = 60;
});
controlsEl.appendChild(resetBtn);

// Initial stats
function updateStats() {
  const totalTris = genomes.reduce((a, g, i) => a + countTriangles(lineup.children[i] || new THREE.Object3D()), 0);
  const totalDraws = genomes.reduce((a, g, i) => a + countDrawCalls(lineup.children[i] || new THREE.Object3D()), 0);
  statsEl.innerHTML = `
    <div><span class="label">Species: </span><span class="value">${genomes.length}</span></div>
    <div><span class="label">Total triangles: </span><span class="value">${totalTris}</span></div>
    <div><span class="label">Draw calls (lineup): </span><span class="value">${totalDraws}</span></div>
    <div><span class="label">Skin materials: </span><span class="value">1 (shared)</span></div>
    <div><span class="label">Palette: </span><span class="value">C "Current+"</span></div>
  `;
}
updateStats();

/* ---------- render loop ----------------------------------------------- */
let time = 0;
function animate(t) {
  requestAnimationFrame(animate);
  time = t * 0.001;

  // Gentle body bob
  if (lineup) {
    lineup.children.forEach((c, i) => {
      const bob = Math.sin(time * 0.8 + i * 1.2) * 0.02;
      c.position.y = bob;
    });
  }

  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Hide loading
document.getElementById('loading').style.display = 'none';

controls.object = camera;
animate(0);
</script>
</body>
</html>

<!doctype html>

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Primigenia gait lab</title>
<!--
  Gait lab (docs/briefs/gait-lab.md, DESIGN A35: prototype in three.js, ship in Godot). Lab only, not kept in sync with Godot.
  16 procedural creatures walk in a straight line at once. Rows = body plan (biped, quadruped, hexapod, 8-leg), columns = size x leg
  length (small 0.30 m / large 1.50 m, short legs = 0.6 x long). Same rules for all: gait from the Froude number, stride and duty
  from Fr, stance feet pinned in the world (zero slip by construction), 2-bone analytic IK, bob from stance state.
  URL: ?test=1 runs the self-check on load (result in #check and window.__gaitlabCheck), ?preset=walk|trot|gallop|game|gamefix
  three.js r128 from cdnjs (same as web/lookdev). No other dependency, no build step.

  Sources (each number below is cited or marked "starting value"):
   Alexander & Jayes 1983 / Alexander 1976,1984: dynamic similarity, Fr = v^2/(g h), relative stride lambda/h = 2.3 Fr^0.3 (walk, trot, run).
   Alexander 1989 "Optimization and gaits in the locomotion of vertebrates": walk -> run/trot near Fr 0.5, trot -> gallop near Fr 2.5;
      gallop lambda/h = 1.9 Fr^0.4 (as in godot/locomotion/loco_gait.gd).
   Hildebrand 1965/1977: footfall sequences (lateral-sequence walk, diagonal trot, transverse gallop).
   Cavagna et al 1977 / Geyer 2006: walk = inverted pendulum (hip highest at mid-stance), run = spring-mass (hip lowest at mid-stance).
   Wilson 1966, Ritzmann 2004: insect tripod gait above slow speeds, metachronal wave (phase lag shrinks with speed) in many-legged animals.
   Duty curves, bob amplitudes, lift heights, lean: STARTING VALUES, to be checked by tracker test M1.
-->
<style>

<body>

  <div class="grp" id="presets"><span>Preset</span></div>

<script>
"use strict";
(() => {
const G = 9.81;
const TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const frac = (x) => x - Math.floor(x);
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const wrapd = (d) => d - Math.round(d);               // shortest signed difference on a unit circle

// ---------------------------------------------------------------- body plans (rows) and size/leg columns
const PLAN_NAMES = ['biped', 'quadruped', 'hexapod', '8-leg'];
const COLS = [
  { name: 'small short-leg', S: 0.30, legK: 0.6 },
  { name: 'small long-leg', S: 0.30, legK: 1.0 },
  { name: 'large short-leg', S: 1.50, legK: 0.6 },
  { name: 'large long-leg', S: 1.50, legK: 1.0 },
];
// S = body size scale (m); h = hip height = S * legK. small ~0.3 m, large ~1.5 m, short = 0.6 x long (brief).

function legSpecs(plan, S, h) {
  const L = [];
  const add = (o) => L.push(Object.assign({ fz: 0 }, o));
  if (plan === 'biped') {
    // digitigrade biped: visible joint (ankle/hock) points back
    for (const s of [-1, 1]) add({ name: s < 0 ? 'L' : 'R', side: s, hx: 0, hz: s * 0.10 * S, pole: [-1, 0, 0], ltK: 1.15, i: 0 });
  } else if (plan === 'quadruped') {
    // order LH, RH, LF, RF. Hind hock and fore elbow both point back.
    for (const [nm, x, i] of [['H', -0.62, 0], ['F', 0.62, 1]]) for (const s of [-1, 1])
      add({ name: (s < 0 ? 'L' : 'R') + nm, side: s, hx: x * S, hz: s * 0.14 * S, pole: [-1, 0, 0], ltK: 1.15, i });
  } else if (plan === 'hexapod') {
    const sp = Math.max(0.55 * S, 1.15 * h);  // coxa spacing; long enough that neighbouring feet cannot cross
    for (const s of [-1, 1]) for (let i = 0; i < 3; i++)
      add({ name: (s < 0 ? 'L' : 'R') + (3 - i), side: s, hx: (i - 1) * sp, hz: s * 0.12 * S, fz: s * 0.65 * h, pole: [0, 0.8, s * 0.6], ltK: 1.42, i, sp });
  } else {
    const sp = Math.max(0.45 * S, 1.0 * h);
    for (const s of [-1, 1]) for (let i = 0; i < 4; i++)
      add({ name: (s < 0 ? 'L' : 'R') + (4 - i), side: s, hx: (i - 1.5) * sp, hz: s * 0.12 * S, fz: s * 0.6 * h, pole: [0, 0.8, s * 0.6], ltK: 1.42, i, sp });
  }
  return L;
}

// ---------------------------------------------------------------- gait rules (the part that ports to loco_gait.gd)
const H_FR = 0.04; // hysteresis around the change Fr
function selectGait(plan, prev, fr, legacy) {
  if (plan === 'biped') {
    if (legacy) return 'walk';
    if (prev === 'run') return fr < 0.5 - H_FR ? 'walk' : 'run';
    return fr > 0.5 + H_FR ? 'run' : 'walk';
  }
  if (plan === 'quadruped') {
    if (legacy) return 'walk';
    let g = prev;
    if (g === 'gallop') { if (fr < 2.5 - H_FR) g = 'trot'; }
    else if (g === 'trot') { if (fr > 2.5 + H_FR) g = 'gallop'; else if (fr < 0.5 - H_FR) g = 'walk'; }
    else { g = 'walk'; if (fr > 0.5 + H_FR) g = 'trot'; if (fr > 2.5 + H_FR) g = 'gallop'; }
    return g;
  }
  if (plan === 'hexapod') {
    if (prev === 'tripod') return fr < 0.15 - 0.02 ? 'wave' : 'tripod';
    return fr > 0.15 + 0.02 ? 'tripod' : 'wave';
  }
  return 'meta';
}
const HAS_FLIGHT_CLASS = { walk: false, wave: false, tripod: false, meta: false, trot: true, run: true, gallop: true };

// Returns target gait parameters for a creature (cr) at Froude number fr.
function gaitParams(cr, gait, fr) {
  const plan = cr.plan, h = cr.h, n = cr.legs.length;
  const P = { gait, off: new Array(n).fill(0), beta: 0.6, stride: 1, a0: 1, a1: 0, lean: 0, flex: 0, lift: 0.15 * h, runness: 0, roll: 0.03 };
  let Fs = fr; // Fr used for the stride law
  switch (gait) {
    case 'walk': {
      Fs = Math.min(fr, 0.5);
      P.beta = clamp(0.78 - 0.46 * Fs, 0.55, 0.78);       // starting value; walks have duty >= 0.5 (Alexander 1989)
      P.stride = 2.3 * Math.pow(Math.max(Fs, 1e-3), 0.3) * h; // Alexander & Jayes 1983
      P.a0 = 0.965; P.a1 = 0.045;                           // inverted pendulum: high at mid-stance (Cavagna 1977); starting amplitude
      P.lift = 0.12 * h; P.roll = 0.035;
      if (plan === 'biped') P.off = [0, 0.5];
      else P.off = [0.5, 0, 0.75, 0.25];                    // LH RH LF RF: Hildebrand lateral sequence RH 0, RF .25, LH .5, LF .75
      break;
    }
    case 'trot': {
      P.beta = clamp(0.48 * Math.pow(Fs / 0.5, -0.25), 0.28, 0.48); // starting value: <0.5 => suspension phase
      P.stride = 2.3 * Math.pow(Fs, 0.3) * h;
      P.a0 = 1.03; P.a1 = -0.09;                            // spring-mass: lowest at mid-stance, peak in flight
      P.lift = 0.2 * h; P.runness = 1; P.roll = 0.02; P.flex = 0.02;
      P.off = [0, 0.5, 0.5, 0];                             // diagonal pairs LH+RF, RH+LF
      break;
    }
    case 'run': {
      P.beta = clamp(0.48 * Math.pow(Fs / 0.5, -0.3), 0.22, 0.48);   // starting value (human sprint ~0.25)
      P.stride = 2.3 * Math.pow(Fs, 0.3) * h;
      P.a0 = 1.03; P.a1 = -0.09; P.lift = 0.22 * h; P.runness = 1; P.roll = 0.02;
      P.lean = 0.12 * smooth(0.4, 3.0, fr);                  // forward lean, starting value (loco_gait.run_lean)
      P.off = [0, 0.5];
      break;
    }
    case 'gallop': {
      P.beta = clamp(0.32 * Math.pow(Fs / 2.5, -0.3), 0.2, 0.32);    // starting value, continuous with trot at Fr 2.5 (0.32)
      P.stride = 1.9 * Math.pow(Fs, 0.4) * h;                // Alexander & Jayes 1983 gallop law
      P.a0 = 1.03; P.a1 = -0.10; P.lift = 0.25 * h; P.runness = 1; P.roll = 0.01;
      P.flex = clamp(0.045 * Math.pow(Fs / 2.5, 0.3), 0, 0.11); // spine flexion / pitch swing, as loco_gait.spine_flex
      P.off = [0, 0.1, 0.5, 0.6];                            // transverse gallop LH RH LF RF (Hildebrand 1977)
      break;
    }
    case 'wave': {
      P.beta = 0.78; P.stride = 2.3 * Math.pow(Fs, 0.3) * h; P.a0 = 1; P.a1 = 0; P.lift = 0.22 * h; P.roll = 0.01;
      for (const [k, l] of cr.legs.entries()) P.off[k] = frac(l.i / 6 + (l.side > 0 ? 0.5 : 0));
      break;
    }
    case 'tripod': {
      P.beta = clamp(0.62 - 0.05 * Fs, 0.52, 0.62);          // starting value; kept >= 0.5 so some tripod is always down
      P.stride = 2.3 * Math.pow(Fs, 0.3) * h; P.a0 = 1; P.a1 = 0; P.lift = 0.25 * h; P.roll = 0.01;
      for (const [k, l] of cr.legs.entries()) P.off[k] = frac((l.i % 2 ? 0.5 : 0) + (l.side > 0 ? 0.5 : 0));
      break;
    }
    case 'meta': {
      P.beta = clamp(0.7 - 0.08 * Math.log10(Math.max(Fs, 0.05) / 0.05), 0.55, 0.75);
      P.stride = 2.3 * Math.pow(Fs, 0.3) * h; P.a0 = 1; P.a1 = 0; P.lift = 0.25 * h; P.roll = 0.01;
      const lag = 0.22 * Math.pow(Math.max(Fs, 0.05) / 0.05, -0.23);  // phase lag per segment 0.22 -> 0.08, starting values
      P.lag = lag;
      for (const [k, l] of cr.legs.entries()) P.off[k] = frac(l.i * lag + (l.side > 0 ? 0.5 : 0));
      break;
    }
  }
  // insects: stance travel may not exceed the coxa spacing (feet of neighbouring legs must never cross)
  if (cr.legs[0].sp) {
    const maxL = 0.9 * cr.legs[0].sp;
    if (P.stride * P.beta > maxL) { P.stride = maxL / P.beta; P.capped = true; }
  }
  return P;
}

function mixParams(A, B, t) {
  const R = Object.assign({}, B);
  R.off = B.off.map((o, i) => frac(A.off[i] + wrapd(o - A.off[i]) * t));
  for (const k of ['beta', 'a0', 'a1', 'lean', 'flex', 'lift', 'runness', 'roll']) R[k] = lerp(A[k], B[k], t);
  return R;
}

// ---------------------------------------------------------------- 2-bone IK
const _v = new THREE.Vector3();
function ik(P, T, a, b, pole, out) {
  const d = _v.copy(T).sub(P);
  let dist = d.length();
  const reach = a + b - 1e-4, minr = Math.abs(a - b) + 1e-4;
  out.clamped = false;
  if (dist > reach) { dist = reach; out.clamped = true; } else if (dist < minr) { dist = minr; out.clamped = true; }
  const u = d.normalize();
  const along = (a * a - b * b + dist * dist) / (2 * dist);
  const hgt = Math.sqrt(Math.max(0, a * a - along * along));
  const pd = pole.clone().addScaledVector(u, -pole.dot(u));
  if (pd.lengthSq() < 1e-8) pd.set(0, 0, 1).addScaledVector(u, -u.z);
  pd.normalize();
  out.knee.copy(P).addScaledVector(u, along).addScaledVector(pd, hgt);
  out.foot.copy(P).addScaledVector(u, dist);
}

// ---------------------------------------------------------------- creature
const MAT = {
  body: new THREE.MeshLambertMaterial({ color: 0xc58a4a }),
  head: new THREE.MeshLambertMaterial({ color: 0xe0b070 }),
  near: new THREE.MeshLambertMaterial({ color: 0xe9e2d0 }),
  far: new THREE.MeshLambertMaterial({ color: 0x6e6a60 }),
  knee: new THREE.MeshLambertMaterial({ color: 0xe8a41c }),
  foot: new THREE.MeshLambertMaterial({ color: 0x3fa7d6 }),
  ground: new THREE.MeshLambertMaterial({ color: 0x2b3038 }),
  tickA: new THREE.MeshBasicMaterial({ color: 0x59616d }),
  tickB: new THREE.MeshBasicMaterial({ color: 0x3a414a }),
  mark: new THREE.MeshBasicMaterial({ color: 0xf2c14e }),
};
const GEO = {
  cyl: new THREE.CylinderGeometry(1, 1, 1, 8),
  box: new THREE.BoxGeometry(1, 1, 1),
  sph: new THREE.SphereGeometry(1, 10, 8),
};
const Y = new THREE.Vector3(0, 1, 0);

class Creature {
  constructor(plan, col, row, ci) {
    this.plan = plan; this.row = row; this.ci = ci; this.col = COLS[ci];
    this.S = this.col.S; this.h = this.S * this.col.legK;
    this.legs = legSpecs(plan, this.S, this.h);
    this.vert = plan === 'biped' || plan === 'quadruped';
    this.scene = new THREE.Scene();
    this.scene.background = new THREE.Color(0x1a1d22);
    this.scene.add(new THREE.AmbientLight(0xffffff, 0.62));
    const dl = new THREE.DirectionalLight(0xffffff, 0.75); dl.position.set(-2, 4, 6); this.scene.add(dl);
    this.cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 100 * this.S);
    this.cam.position.set(0, 0, 20 * this.S);
    this.buildWorld();
    this.buildBody();
    this.reset();
  }
  buildWorld() {
    const S = this.S, sp = 0.5 * this.bodyLen(), W = 7 * S;
    this.tickSp = sp;
    const g = new THREE.Group(); this.ground = g; this.scene.add(g);
    const slab = new THREE.Mesh(GEO.box, MAT.ground); slab.scale.set(2 * W, 3 * S, 4 * S); slab.position.set(0, -1.5 * S, 0); g.add(slab);
    this.ticks = new THREE.Group(); this.scene.add(this.ticks);
    const nt = Math.ceil(W / sp) + 2;
    for (let i = -nt; i <= nt; i++) {
      const t = new THREE.Mesh(GEO.box, i % 2 ? MAT.tickB : MAT.tickA);
      t.scale.set(0.045 * S, 0.5 * S, 0.02 * S); t.position.set(i * sp, -0.25 * S, 2.01 * S); this.ticks.add(t);
    }
    this.nt = nt;
    this.marks = []; this.markI = 0;
    for (let i = 0; i < 40; i++) {
      const m = new THREE.Mesh(GEO.box, MAT.mark); m.scale.set(0.035 * S, 0.1 * S, 0.02 * S); m.position.set(0, -1e3, 2.05 * S); this.scene.add(m); this.marks.push(m);
    }
  }
  bodyLen() { return { biped: 1.0, quadruped: 1.7, hexapod: 2.0, '8-leg': 2.6 }[this.plan] * this.S; }
  buildBody() {
    const S = this.S, plan = this.plan;
    const body = this.body = new THREE.Group(); this.scene.add(body);
    const box = (sx, sy, sz, x, y, z, mat, parent) => { const m = new THREE.Mesh(GEO.box, mat); m.scale.set(sx, sy, sz); m.position.set(x, y, z); (parent || body).add(m); return m; };
    this.head = new THREE.Group(); body.add(this.head);
    this.tail = new THREE.Group(); body.add(this.tail);
    if (plan === 'biped') {
      box(1.0 * S, 0.3 * S, 0.26 * S, 0, 0.07 * S, 0, MAT.body);
      this.head.position.set(0.5 * S, 0.12 * S, 0); box(0.3 * S, 0.14 * S, 0.14 * S, 0.15 * S, 0.1 * S, 0, MAT.head, this.head);
      this.tail.position.set(-0.5 * S, 0.1 * S, 0); box(1.0 * S, 0.1 * S, 0.1 * S, -0.5 * S, 0, 0, MAT.body, this.tail);
    } else if (plan === 'quadruped') {
      box(1.7 * S, 0.32 * S, 0.3 * S, 0, 0.08 * S, 0, MAT.body);
      this.head.position.set(0.85 * S, 0.12 * S, 0); box(0.45 * S, 0.17 * S, 0.17 * S, 0.22 * S, 0.06 * S, 0, MAT.head, this.head);
      this.tail.position.set(-0.85 * S, 0.12 * S, 0); box(0.5 * S, 0.06 * S, 0.06 * S, -0.25 * S, 0, 0, MAT.body, this.tail);
    } else if (plan === 'hexapod') {
      const sp = this.legs[0].sp;
      box(sp * 0.8, 0.22 * S, 0.24 * S, sp, 0.04 * S, 0, MAT.body);  // thorax segments over coxae
      box(sp * 0.9, 0.22 * S, 0.24 * S, 0, 0.04 * S, 0, MAT.body);
      box(sp * 0.9, 0.22 * S, 0.24 * S, -sp, 0.04 * S, 0, MAT.body);
      this.head.position.set(1.4 * sp + 0.15 * S, 0.04 * S, 0); box(0.3 * S, 0.2 * S, 0.2 * S, 0, 0, 0, MAT.head, this.head);
      this.tail.position.set(-1.45 * sp, 0.04 * S, 0); box(0.35 * S, 0.14 * S, 0.14 * S, -0.1 * S, 0, 0, MAT.body, this.tail);
    } else {
      const sp = this.legs[0].sp;
      for (let i = 0; i < 4; i++) box(sp * 0.85, 0.2 * S, 0.22 * S, (i - 1.5) * sp, 0.04 * S, 0, i % 2 ? MAT.body : MAT.head);
      this.head.position.set(1.925 * sp + 0.15 * S, 0.04 * S, 0); box(0.3 * S, 0.2 * S, 0.2 * S, 0, 0, 0, MAT.head, this.head);
      this.tail.position.set(-1.925 * sp, 0.04 * S, 0); box(0.3 * S, 0.1 * S, 0.1 * S, -0.1 * S, 0, 0, MAT.body, this.tail);
    }
    this.hipSphere = [];
    for (const l of this.legs) {
      l.lt = l.ltK * this.h; l.a = l.lt * 0.5; l.b = l.lt * 0.5;
      if (this.vert && this.plan === 'biped') { l.a = l.lt * 0.54; l.b = l.lt * 0.46; }
      const mat = l.side > 0 ? MAT.near : MAT.far;
      const r = 0.03 * this.S * (this.vert ? 1.2 : 0.75);
      l.m1 = new THREE.Mesh(GEO.cyl, mat); l.m2 = new THREE.Mesh(GEO.cyl, mat); l.r1 = r; l.r2 = r * 0.78;
      l.mk = new THREE.Mesh(GEO.sph, MAT.knee); l.mk.scale.setScalar(r * 1.15);
      l.mf = new THREE.Mesh(GEO.sph, MAT.foot); l.mf.scale.setScalar(r * 1.25);
      this.scene.add(l.m1, l.m2, l.mk, l.mf);
      l.polev = new THREE.Vector3(l.pole[0], l.pole[1], l.pole[2]).normalize();
      l.ikout = { knee: new THREE.Vector3(), foot: new THREE.Vector3(), clamped: false };
      l.hip = new THREE.Vector3(); l.foot = new THREE.Vector3(); l.target = new THREE.Vector3();
    }
  }
  reset() {
    this.x = 0; this.p = 0.123; this.v = 0; this.gait = null; this.cur = null; this.prev = null; this.bl = 1; this.blendFrom = null;
    this.strideSince = 0; this.stanceCount = 0; this.time = 0; this.pitch = 0; this.roll = 0; this.hipY = this.h;
    this.fr = 0; this.f = 1; this.first = true;
    this.clearMetrics();
    for (const l of this.legs) { l.stance = true; l.plant = new THREE.Vector3(); l.lift = new THREE.Vector3(); l.iv = []; l.plants = []; l.w = 0; }
  }
  clearMetrics() {
    this.m = { n: 0, noStance: 0, kneeBad: 0, cross: 0, below: 0, laneErr: 0, clampN: 0, safetyN: 0, drag: 0, hipMin: 1e9, hipMax: -1e9, pitchMax: 0 };
    for (const l of this.legs) { l.slip = 0; l.stN = 0; l.plants = []; l.plantT = []; }
    this.mT0 = this.time;
  }
  // stance foot position for leg phase q (used only at start)
  initLegs(P) {
    const L = P.stride * P.beta;
    for (const [k, l] of this.legs.entries()) {
      const q = frac(this.p - P.off[k]);
      const home = this.x + l.hx;
      if (q < P.beta) { l.stance = true; l.plant.set(home + L * (0.5 - q / P.beta), 0, l.hz + l.fz); l.foot.copy(l.plant); }
      else {
        l.stance = false; const s = (q - P.beta) / (1 - P.beta);
        const land = home + L / 2 + this.v * (1 - q) / this.f;

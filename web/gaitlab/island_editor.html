<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Primigenia · Island editor</title>
<link rel="icon" href="data:,">
<style>
:root{color-scheme:dark;--bg:#16191d;--panel:#20252b;--raised:#2c3239;--ink:#efebe2;--dim:#b5babf;--line:#424850;--gold:#edc578;--teal:#9fd3cb;--red:#ff9a8c;--green:#a3d4ad;--sheet:46vh;--bar:52px;--ease:cubic-bezier(.23,1,.32,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,sans-serif;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:8px 12px;min-height:44px;cursor:pointer;touch-action:manipulation;transition:transform 140ms var(--ease),background-color 140ms var(--ease),border-color 140ms var(--ease)}
button:active:not(:disabled){transform:scale(.97)}
button:disabled{opacity:.45;cursor:default}
button[aria-pressed=true],button.on{border-color:var(--gold);color:var(--gold)}
button.danger{border-color:#7a4540;color:var(--red)}
button.small{min-height:36px;padding:4px 10px}
@media(hover:hover){button:hover:not(:disabled){background:#3a424b}}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.instant,.instant *{transition:none!important;animation:none!important}
#app{display:flex;flex-direction:column;height:100%;height:100dvh}
#top{display:flex;align-items:center;gap:8px;min-height:var(--bar);padding:4px 10px;padding-top:max(4px,env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line)}
#top h1{font-size:16px;margin:0;white-space:nowrap}
#top .grow{flex:1;min-width:0}
#chip{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chip b{font-weight:600;color:var(--ink)}
#chip.ok b{color:var(--green)}#chip.bad b{color:var(--red)}
main{position:relative;flex:1;min-height:0;display:flex}
#mapwrap{position:relative;flex:1;min-width:0;min-height:0;background:#0e1114;overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:grab;outline:none}
#map.paint{cursor:crosshair}
#zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
#zoom button{width:44px;padding:0;font-size:20px;background:#20252bdd}
#hud:empty{display:none}
#hud{position:absolute;left:8px;top:8px;max-width:calc(100% - 72px);padding:4px 8px;border-radius:6px;background:#0e1114cc;font-size:12px;color:var(--dim);pointer-events:none}
#busy{position:absolute;left:8px;top:44px;display:none;max-width:calc(100% - 72px);padding:6px 10px;border-radius:6px;background:#0e1114e6;font-size:12px;color:var(--ink);pointer-events:none}
#busy.on{display:block}
#busy .bar{height:3px;margin-top:5px;background:#30363d;border-radius:2px;overflow:hidden}
#busy .bar i{display:block;height:100%;width:0;background:var(--gold);transition:width 160ms var(--ease)}
#toast{position:absolute;left:50%;bottom:calc(var(--inset,0px) + 14px);transform:translate(-50%,8px);max-width:90%;padding:8px 14px;border-radius:8px;background:#0e1114f2;border:1px solid var(--line);font-size:13px;opacity:0;pointer-events:none;transition:opacity 180ms var(--ease),transform 180ms var(--ease);z-index:5}
#toast.on{opacity:1;transform:translate(-50%,0)}
#sheet{position:absolute;left:0;right:0;bottom:0;height:var(--sheet);display:flex;flex-direction:column;background:var(--panel);border-top:1px solid var(--line);border-radius:12px 12px 0 0;box-shadow:0 -6px 24px #0008;transition:transform 220ms var(--ease);z-index:4}
#sheet.peek{transform:translateY(calc(100% - var(--bar)))}
#grab{align-self:center;width:72px;min-height:20px;height:20px;padding:0;margin:2px 0 0;border:0;background:transparent;position:relative}
#grab::after{content:"";position:absolute;left:16px;right:16px;top:8px;height:4px;border-radius:2px;background:var(--line)}
#tabs{display:flex;gap:4px;padding:0 8px 6px;border-bottom:1px solid var(--line)}
#tabs button{flex:1;min-height:32px;padding:2px 4px;background:transparent;border-color:transparent;font-size:13px}
#tabs button[aria-selected=true]{border-color:var(--gold);color:var(--gold)}
#tabs .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:5px;background:var(--line)}
#tabs .dot.ok{background:var(--green)}#tabs .dot.bad{background:var(--red)}
#panels{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:10px 12px calc(14px + env(safe-area-inset-bottom))}
.pane{display:none}.pane.on{display:block}
h2{font-size:13px;margin:14px 0 6px;color:var(--teal);font-weight:600;letter-spacing:.02em}
h2:first-child{margin-top:0}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0;align-items:center}
.row.tools button{flex:1;min-width:0}
.hint{color:var(--dim);font-size:12px;margin:4px 0}
label.f{display:grid;grid-template-columns:minmax(76px,30%) minmax(0,1fr) 84px;gap:8px;align-items:center;margin:4px 0;font-size:13px}
label.f.nr{grid-template-columns:minmax(76px,30%) minmax(0,1fr)}
label.f span.k{color:var(--dim)}
label.f input[type=range]{width:100%;min-height:36px;accent-color:var(--gold)}
label.f input[type=number],label.f input[type=text],label.f select,.inp{width:100%;min-height:40px;padding:4px 8px;background:var(--bg);border:1px solid var(--line);border-radius:6px}
label.f .echo{grid-column:2/4;color:var(--dim);font-size:11.5px;margin-top:-4px}
label.f.nr .echo{grid-column:2}
.chk{display:flex;align-items:center;gap:8px;min-height:40px;font-size:13px}
.chk input{width:22px;height:22px;accent-color:var(--gold)}
.list button{display:block;width:100%;text-align:left;min-height:44px;margin:3px 0;padding:6px 10px;font-size:13px}
.list button small{color:var(--dim);margin-left:6px}
.list button.sel{border-color:var(--gold);color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chips button{min-width:44px;padding:4px 8px}
details{margin:8px 0}summary{cursor:pointer;min-height:36px;display:flex;align-items:center;color:var(--teal);font-weight:600;font-size:13px}
.rule{display:grid;grid-template-columns:22px 1fr;gap:2px 8px;padding:8px 0;border-bottom:1px solid #30363d}
.rule i{width:14px;height:14px;border-radius:50%;margin-top:3px;background:var(--line);grid-row:1/3}
.rule.ok i{background:var(--green)}.rule.bad i{background:var(--red)}
.rule b{font-weight:600}.rule span{color:var(--dim);font-size:12px}
.rule.bad .v{color:var(--red)}.rule.ok .v{color:var(--green)}
table.kv{border-collapse:collapse;width:100%;font-size:12.5px}table.kv td{padding:3px 4px;border-bottom:1px solid #30363d;vertical-align:top}table.kv td:first-child{color:var(--dim);width:36%}
code{font:12px ui-monospace,monospace;word-break:break-all}
textarea.inp{min-height:110px;font:12px ui-monospace,monospace}
@media(min-width:900px){
  main{display:grid;grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:minmax(0,1fr)}
  #sheet{position:static;height:auto;min-height:0;overflow:hidden;border-radius:0;border-top:0;border-left:1px solid var(--line);box-shadow:none;transform:none!important;transition:none}
  #grab{display:none}
  #zoom button{width:40px}
}
@media(max-width:479px){#top h1{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <h1>Island editor</h1>
    <div class="grow"><div id="chip" aria-live="polite">loading the C terrain (WASM)</div></div>
    <button id="undo" class="small" disabled aria-label="Undo">Undo</button>
    <button id="redo" class="small" disabled aria-label="Redo">Redo</button>
  </header>
  <main>
    <section id="mapwrap" aria-label="Island map">
      <canvas id="map" tabindex="0" aria-label="Island map. Drag handles to reshape; pinch to zoom; long press to add a point."></canvas>
      <div id="hud"></div>
      <div id="busy"><span id="busy-text"></span><div class="bar"><i id="busy-bar"></i></div></div>
      <div id="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">&minus;</button><button id="zfit" aria-label="Fit the island" class="small" style="width:44px">Fit</button></div>
      <div id="toast" role="status"></div>
    </section>
    <aside id="sheet" aria-label="Inspector">
      <button id="grab" aria-label="Show or hide the panel"></button>
      <nav id="tabs" role="tablist">
        <button role="tab" id="tab-edit" aria-selected="true" aria-controls="p-edit">Edit</button>
        <button role="tab" id="tab-layers" aria-selected="false" aria-controls="p-layers">Layers</button>
        <button role="tab" id="tab-check" aria-selected="false" aria-controls="p-check">Check<span class="dot" id="checkdot"></span></button>
        <button role="tab" id="tab-island" aria-selected="false" aria-controls="p-island">Island</button>
      </nav>
      <div id="panels">
        <section class="pane on" id="p-edit" role="tabpanel"></section>
        <section class="pane" id="p-layers" role="tabpanel"></section>
        <section class="pane" id="p-check" role="tabpanel"></section>
        <section class="pane" id="p-island" role="tabpanel"></section>
      </div>
    </aside>
  </main>
</div>
<script type="module" src="island_editor.js"></script>
</body>
</html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1280">
<title>Primigenia UI: loadout at the nest</title><script src="kit.js"></script></head><body><script>
const {C,arc,glyph,text,creature,groundRing,hud,page,P,K}=Kit;
// L at the nest. Known moves above (the outline shape is the role), the four slots below. No panel.
const poly=(x,y,r,n,rot)=>{let d='';for(let i=0;i<n;i++){const a=(rot+i*360/n)*Math.PI/180;d+=(i?'L':'M')+(x+r*Math.sin(a)).toFixed(1)+' '+(y-r*Math.cos(a)).toFixed(1)}return d+'Z'};
const shape=(role,x,y,r,o={})=>{const st='fill="'+C.ink+'" fill-opacity=".28" stroke="'+(o.color||C.bone)+'" stroke-width="'+(o.w||1.5)+'" opacity="'+(o.op||.9)+'" '+(o.dash?'stroke-dasharray="2.5 4.5"':'')+' stroke-linejoin="round"';
  if(role==='basic')return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" '+st+'/>';
  if(role==='engage')return '<path d="'+poly(x,y+2,r*1.25,3,90)+'" '+st+'/>';
  if(role==='poke')return '<path d="'+poly(x,y,r*1.2,4,0)+'" '+st+'/>';
  if(role==='control')return '<path d="'+poly(x,y,r*1.3,4,45)+'" '+st+'/>';
  return '<path d="'+poly(x,y,r*1.12,6,0)+'" '+st+'/>';};
const known=[['bite','basic'],['charge','engage'],['pounce','engage'],['spit','poke'],['quill','poke'],['tail','control'],['stomp','control',1]];
let m=text(640,330,'At the nest',{serif:true,size:24,anchor:'middle'});
known.forEach((k,i)=>{const x=418+i*74,y=400,sel=i===2;
  m+=shape(k[1],x,y,23,{dash:k[2],op:k[2]?.45:sel?1:.85,w:sel?2.6:1.5,color:sel?C.copper:C.bone})+(k[2]?'':glyph(k[0],x,y,25,C.bone,1));});
m+=text(566,458,'Pounce',{size:19,weight:500,anchor:'middle'})+text(566,478,'Engage · leaps in, stuns',{size:14.5,color:C.fog,anchor:'middle'});
m+='<path d="M440 510H840" stroke="'+C.bone+'" stroke-width="1" opacity=".22"/>';
[['bite','basic'],['charge','engage'],['spit','poke'],null].forEach((k,i)=>{const x=530+i*74,y=560;
  if(k) m+=shape(k[1],x,y,27,{})+glyph(k[0],x,y,29,C.bone,1);
  else m+='<circle cx="'+x+'" cy="'+y+'" r="27" fill="none" stroke="'+C.copper+'" stroke-width="2" stroke-dasharray="3 5"/>';
  m+=text(x,y+50,String(i+1),{size:15.5,anchor:'middle',weight:500});});
m+='<path d="M566 430Q640 500 742 532" fill="none" stroke="'+C.copper+'" stroke-width="1.4" stroke-dasharray="1 7" stroke-linecap="round" opacity=".8"/>';
page({title:'Loadout', time:'midday',
  world: '<ellipse cx="930" cy="470" rx="70" ry="20" fill="#5b4a33"/><ellipse cx="930" cy="464" rx="52" ry="13" fill="#3d3122"/><ellipse cx="918" cy="462" rx="11" ry="14" fill="#E9E2CF"/><ellipse cx="944" cy="464" rx="10" ry="13" fill="#E9E2CF"/>' + creature(1060,520,0.9,{stripes:1,flip:1}),
  veil: '<rect width="1280" height="720" fill="#18221f" opacity=".42"/>',
  marks: m + hud({quiet:.5})
});
</script></body></html>

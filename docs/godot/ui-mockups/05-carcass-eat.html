<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1280">
<title>Primigenia UI: carcass, eating</title><script src="kit.js"></script></head><body><script>
const {defence,C,arc,glyph,text,creature,groundRing,moveMarker,radial,petals,fieldNote,hud,whisper,keycap,page,P,K}=Kit;

// A carcass: the ring is cut into the bites left. Eating: the hunger line grows, a mote of DNA flies to its sign.
const cx=760, cy=430, gy=470;
let mote='';
for(let k=0;k<7;k++){const u=0.52+k*0.045, x=(1-u)*(1-u)*cx+2*u*(1-u)*420+u*u*52, y=(1-u)*(1-u)*(gy-30)+2*u*(1-u)*330+u*u*40; mote+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+(1+k*0.5).toFixed(1)+'" fill="'+C.copper+'" opacity="'+(0.15+k*0.13).toFixed(2)+'"/>';}
page({title:'Eat', time:'midday',
  world: creature(cx,gy,0.7,{color:'#B99A6A',dark:'#8C6C3F',carcass:1}) + creature(610,520,1.0,{stripes:1,tilt:9}),
  marks: groundRing(cx,gy,70,{color:C.ochre,segments:4,left:3})
    + petals(cx,cy-10,84,[{g:'eat',key:'1',active:1,color:C.ochre}])
    + fieldNote(cx+104,cy-46,'Rondo',{sub:'remains'})
    + mote
    + hud({food:.76, foodGain:.12, foodHot:1, dnaHot:1, dna:7, dnaGain:3})
});
</script></body></html>
